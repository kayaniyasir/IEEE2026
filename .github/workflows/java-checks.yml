name: Java 17 compilation and sample checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Java solutions and verify sample outputs
        run: python tests/check_samples.py
